[project]
name = "typst-mdx-pipeline"
version = "0.1.0"
description = "Typst Docs to MDX Converter & Translation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12.0",
    "gitpython>=3.1.40",
    "loguru>=0.7.2",
    "markdown-it-py>=3.0.0",
    "pygments>=2.18.0",
    "rich>=13.0.0",
    "semantic-version>=2.10.0",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "types-beautifulsoup4>=4.12.0",
    "types-html5lib>=1.1.11",
    "types-webencodings>=0.5.0",
]

[tool.uv]
package = false